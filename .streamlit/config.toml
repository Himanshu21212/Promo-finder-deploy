[theme]
base = "light"
primaryColor = "#E11D26"
backgroundColor = "#FBF9F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1C"
linkColor = "#E11D26"
borderColor = "#F0E6E7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "14px"
buttonRadius = "14px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "'JetBrains Mono', monospace"
baseFontSize = 16
dataframeHeaderBackgroundColor = "#f4f4f1"
dataframeBorderColor = "#e3e3de"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-700-normal.woff2"
weight = 700
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400

[theme.sidebar]
backgroundColor = "#0D0D0E"
secondaryBackgroundColor = "#161618"
borderColor = "#232326"

[client]
toolbarMode = "viewer"
showErrorDetails = "type"

[server]
maxUploadSize = 50
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#d6194a"
backgroundColor = "#f6f6f3"
secondaryBackgroundColor = "#ecece8"
textColor = "#121216"
linkColor = "#b3133d"
borderColor = "#d9d9d3"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
codeFont = "'JetBrains Mono', monospace"
baseFontSize = 16
dataframeHeaderBackgroundColor = "#f4f4f1"
dataframeBorderColor = "#e3e3de"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-400-normal.woff2"
weight = 400
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-500-normal.woff2"
weight = 500
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-600-normal.woff2"
weight = 600
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-700-normal.woff2"
weight = 700
[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-400-normal.woff2"
weight = 400

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f1"
borderColor = "#e3e3de"

[client]
toolbarMode = "viewer"
showErrorDetails = "type"

[server]
maxUploadSize = 50
enableStaticServing = true

[browser]
gatherUsageStats = false
